version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip3 install -r requirements.txt
      - python3 manage.py collectstatic --noinput
run:
  command: sh -c "gunicorn dms_platform.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
  network:
    port: 8000
    env: PORT
  env:
    - name: DJANGO_SETTINGS_MODULE
      value: dms_platform.settings
  secrets:
    - name: DB_HOST
      value-from: "arn:aws:secretsmanager:us-east-1:891377130720:secret:dms-platform/rds/credentials-irYYEa:host::"
    - name: DB_PORT
      value-from: "arn:aws:secretsmanager:us-east-1:891377130720:secret:dms-platform/rds/credentials-irYYEa:port::"
    - name: DB_NAME
      value-from: "arn:aws:secretsmanager:us-east-1:891377130720:secret:dms-platform/rds/credentials-irYYEa:dbname::"
    - name: DB_USER
      value-from: "arn:aws:secretsmanager:us-east-1:891377130720:secret:dms-platform/rds/credentials-irYYEa:username::"
    - name: DB_PASSWORD
      value-from: "arn:aws:secretsmanager:us-east-1:891377130720:secret:dms-platform/rds/credentials-irYYEa:password::"
